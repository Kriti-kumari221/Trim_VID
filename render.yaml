services:
  - type: web
    name: cliptrim-hd-studio
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: TTL_HOURS
        value: 168
      - key: MAX_UPLOAD_MB
        value: 2048
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: cliptrim-data
      mountPath: /app/data
      sizeGB: 10
